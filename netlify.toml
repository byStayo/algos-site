[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled function for daily data collection at market close
# Runs at 4:35 PM ET (21:35 UTC) Monday-Friday
[functions."collect-daily-data"]
  schedule = "35 21 * * 1-5"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
